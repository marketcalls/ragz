[project]
name = "ragz"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "structlog>=24.1",
    "email-validator>=2.1",
    "redis>=5.0",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "qdrant-client>=1.17,<1.19",
    "fastembed>=0.6",
    "docling>=2.15",
    "easyocr>=1.7",
    "aioboto3>=13.0",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "tiktoken>=0.9",
    "authlib>=1.3",
    "firecrawl-anydoc>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres,redis,qdrant,minio]>=4.5",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "psycopg2-binary>=2.9",
    "pillow>=10.1",
]
loadtest = ["locust>=2.29"]
observability = ["sentry-sdk>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragz"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["ragz"]

[[tool.mypy.overrides]]
module = [
    "celery.*", "kombu.*", "fastembed.*", "aioboto3.*", "aiobotocore.*",
    "botocore.*", "docling.*", "docling_core.*", "authlib.*", "sentry_sdk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ragz.worker.tasks"
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "ragz"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["ragz.api", "ragz.worker", "ragz.modules", "ragz.core"]
ignore_imports = [
    # Task 12 (Plan J, §6): update_retrieval_settings's settings-change eval
    # trigger needs worker.tasks.enqueue_eval_run, and importing it at module
    # scope would be a real circular import (evals.service, which this
    # function also imports locally, already imports tenancy.service at
    # module scope). Plan K Task 11 removed the sibling documents.service
    # exception (DOC-5's promote_lineage) by inverting control instead:
    # promote_lineage/set_approved/the ingest.py runners now return a
    # needs-reindex document id, and their ENTRYPOINT callers -- worker/
    # tasks.py's Celery task wrappers (which define enqueue_reindex in the
    # same module, no import needed) and the approve route (api -> worker is
    # an allowed layer direction) -- perform the actual enqueue. This entry
    # remains a live, narrow exception for the unrelated tenancy.service edge.
    "ragz.modules.tenancy.service -> ragz.worker.tasks",
]
