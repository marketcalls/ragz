[project]
name = "ragz"
version = "0.1.0"
requires-python = ">=3.12.4"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "structlog>=24.1",
    "email-validator>=2.1",
    "redis>=5.0",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "qdrant-client>=1.17,<1.19",
    "fastembed>=0.6",
    "docling>=2.15",
    "easyocr>=1.7",
    "aioboto3>=13.0",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.9",
    "cryptography>=50.0",  # sec RAGZ-PUB-12: >=50.0.0 clears PYSEC-2026-3552
    "tiktoken>=0.9",
    "authlib>=1.3",
    "firecrawl-anydoc>=0.1",
    "ddgs>=9.14.4",
    "liteparse>=2.12",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres,redis,qdrant,minio]>=4.5",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "psycopg2-binary>=2.9",
    "pillow>=10.1",
]
loadtest = ["locust>=2.29"]
observability = ["sentry-sdk>=2.8"]

# sec RAGZ-PUB-12: force fixed versions of transitively-pulled packages that
# carry known advisories at the versions the resolver would otherwise pick.
# aiohttp>=3.14.3 clears PYSEC-2026-3545/3546/3547; h2>=4.4.1 clears PYSEC-2026-3628.
[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "h2>=4.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragz"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["ragz"]

[[tool.mypy.overrides]]
module = [
    "celery.*", "kombu.*", "fastembed.*", "aioboto3.*", "aiobotocore.*",
    "botocore.*", "docling.*", "docling_core.*", "authlib.*", "sentry_sdk.*",
    "liteparse.*", "trafilatura.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ragz.worker.tasks"
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "ragz"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["ragz.api", "ragz.worker", "ragz.modules", "ragz.core"]
# No exceptions. The last one (tenancy.service -> worker.tasks, for the
# settings-change eval trigger) died when that trigger moved to the
# transactional outbox: publishing an event needs no knowledge of Celery, so
# the layer violation it required simply stopped existing. Adding an entry here
# should be a last resort -- the outbox is usually the answer.
ignore_imports = []

# --- Module ORM boundaries (Phase 2 item 1) --------------------------------
# The audit's P1 finding was that boundaries were documented but not enforced
# AT MODULE LEVEL: the layered contract puts every business package in the same
# ragz.modules layer, so it cannot see sibling coupling at all. These contracts
# are that missing mechanism. One per module, each forbidding every OTHER
# module's ORM submodules, with the imports that exist today listed in its
# comment as the exceptions they are.
#
# That pins 153 of the 169 module -> foreign-ORM pairs, so the 168 sibling
# boundaries that are already clean cannot silently regress -- which is how the
# coupling the audit found accumulated in the first place. The 16 remaining
# exceptions are the actual backlog, and they shrink one line at a time: give
# the owning module a bulk accessor, drop the import, delete the entry. An
# import-linter failure is then the signal that a boundary moved BACKWARDS.
#
# allow_indirect_imports throughout: forbidden contracts are transitive by
# default, which flags a -> b.service -> c.models. That is a chain through
# another module's public service, not `a` reaching for an ORM class, and the
# rule being enforced is about what each module itself imports.
#
# Generated from the real import graph, not hand-written -- a hand-kept list of
# this size drifts. Supersedes the narrower "chat does not reach into tenancy's
# ORM" contract, which is now just one line of chat's forbidden list.

[[tool.importlinter.contracts]]
# Imports no other module's ORM at all -- fully clean.
name = "audit does not import another module's ORM"
type = "forbidden"
source_modules = ["ragz.modules.audit"]
forbidden_modules = [
  "ragz.modules.auth.models",
  "ragz.modules.bots.models",
  "ragz.modules.chat.models",
  "ragz.modules.documents.models",
  "ragz.modules.evals.models",
  "ragz.modules.models.catalog",
  "ragz.modules.models.models",
  "ragz.modules.outbox.models",
  "ragz.modules.quotas.models",
  "ragz.modules.secrets.models",
  "ragz.modules.tenancy.models",
  "ragz.modules.tenancy.reembed_models",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Still imports: tenancy.models.
name = "auth does not import another module's ORM"
type = "forbidden"
source_modules = ["ragz.modules.auth"]
forbidden_modules = [
