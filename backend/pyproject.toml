[project]
name = "raghub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "structlog>=24.1",
    "email-validator>=2.1",
    "redis>=5.0",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "qdrant-client>=1.17,<1.19",
    "fastembed>=0.6",
    "docling>=2.15",
    "aioboto3>=13.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres,redis,qdrant,minio]>=4.5",
    "python-docx>=1.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raghub"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["raghub"]

[[tool.mypy.overrides]]
module = [
    "celery.*", "kombu.*", "fastembed.*", "aioboto3.*", "aiobotocore.*",
    "botocore.*", "docling.*", "docling_core.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "raghub.worker.tasks"
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "raghub"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["raghub.api", "raghub.worker", "raghub.modules", "raghub.core"]
