[project]
name = "ragz"
version = "0.1.0"
requires-python = ">=3.12.4"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "structlog>=24.1",
    "email-validator>=2.1",
    "redis>=5.0",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "qdrant-client>=1.17,<1.19",
    "fastembed>=0.6",
    "docling>=2.15",
    "easyocr>=1.7",
    "aioboto3>=13.0",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.9",
    "cryptography>=50.0",  # sec RAGZ-PUB-12: >=50.0.0 clears PYSEC-2026-3552
    "tiktoken>=0.9",
    "authlib>=1.3",
    "firecrawl-anydoc>=0.1",
    "ddgs>=9.14.4",
    "liteparse>=2.12",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres,redis,qdrant,minio]>=4.5",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.0",
    "psycopg2-binary>=2.9",
    "pillow>=10.1",
]
loadtest = ["locust>=2.29"]
observability = ["sentry-sdk>=2.8"]

# sec RAGZ-PUB-12: force fixed versions of transitively-pulled packages that
# carry known advisories at the versions the resolver would otherwise pick.
# aiohttp>=3.14.3 clears PYSEC-2026-3545/3546/3547; h2>=4.4.1 clears PYSEC-2026-3628.
[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "h2>=4.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragz"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["ragz"]

[[tool.mypy.overrides]]
module = [
    "celery.*", "kombu.*", "fastembed.*", "aioboto3.*", "aiobotocore.*",
    "botocore.*", "docling.*", "docling_core.*", "authlib.*", "sentry_sdk.*",
    "liteparse.*", "trafilatura.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ragz.worker.tasks"
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "ragz"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["ragz.api", "ragz.worker", "ragz.modules", "ragz.core"]
# No exceptions. The last one (tenancy.service -> worker.tasks, for the
# settings-change eval trigger) died when that trigger moved to the
# transactional outbox: publishing an event needs no knowledge of Celery, so
# the layer violation it required simply stopped existing. Adding an entry here
# should be a last resort -- the outbox is usually the answer.
ignore_imports = []
