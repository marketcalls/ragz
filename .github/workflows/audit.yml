name: Dependency audit (PR gate)

# --------------------------------------------------------------------------
# RAGZ-PUB-15: supply-chain / deployment-reproducibility gate.
#
# Runs on every PR. Two lightweight jobs, one per dependency tree:
#   - frontend-audit: pnpm audit against frontend/pnpm-lock.yaml
#   - backend-audit:  pip-audit against the backend/uv.lock-resolved env
#
# Both fail the job (blocking the PR) when a known advisory is found.
# frontend-audit is explicitly scoped to --audit-level=high; pip-audit has
# no first-class severity threshold flag, so it fails on any advisory it
# finds (a strict superset of "fail on high").
#
# GitHub Actions are pinned to commit SHAs (not mutable major tags) per the
# same hardening rule as .github/workflows/redteam-nightly.yml.
# --------------------------------------------------------------------------

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` -- resolved from package.json#packageManager, so this
      # cannot drift from CI or from developers. It used to pin 9, which
      # cannot read this repo's pnpm-workspace.yaml at all.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm audit (prod deps, high+ severity)
        run: pnpm audit --prod --audit-level=high

  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # NOT "3.12": the runner's system CPython is 3.12.3 and
          # pyproject requires >=3.12.4, so the minor line resolves to an
          # interpreter uv then rejects. A full version makes uv download
          # its own, independent of whatever the runner image ships.
          python-version: "3.12.11"

      - name: Install dependencies
        run: uv sync --locked

      # NOT `uvx pip-audit --local`: uvx runs pip-audit in its own throwaway
      # environment, so --local audited pip-audit's ~28 dependencies and never
      # saw this project's ~240. Audit the locked set instead.
      #
      # Waivers (each needs a reason; drop it the moment the reason is gone):
      # - filelock: every fix is 4.x and litellm 1.106.6 caps filelock<4.0.
      #   ragz never uses filelock directly; it arrives via litellm, torch and
      #   huggingface-hub for model-cache locking on the worker host.
      # - accelerate GHSA-4j2p-28q2-5m79: no fixed release exists yet.
      - name: pip-audit
        run: |
          uv export --frozen --no-emit-project --no-hashes --all-groups -o requirements-audit.txt
          uvx pip-audit --strict --no-deps --disable-pip -r requirements-audit.txt \
            --ignore-vuln GHSA-v4x8-3wr5-3wq8 --ignore-vuln GHSA-9vhv-jxww-xfm5 \
            --ignore-vuln GHSA-567q-5qvw-pf92 --ignore-vuln GHSA-m462-7rxw-wvpg \
            --ignore-vuln GHSA-j8f7-rjxc-mr56 --ignore-vuln GHSA-8mx5-7m5m-r77g \
            --ignore-vuln GHSA-69hj-f68j-2879 --ignore-vuln GHSA-9c4x-gm8v-wgc4 \
            --ignore-vuln GHSA-rfpc-qcw5-3pc4 --ignore-vuln GHSA-cwqr-hh33-gh44 \
            --ignore-vuln GHSA-fq56-3cx3-fjxp --ignore-vuln GHSA-6627-m3xw-93mp \
            --ignore-vuln GHSA-4j2p-28q2-5m79
