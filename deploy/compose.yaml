name: raghub
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raghub
      POSTGRES_PASSWORD: raghub
      POSTGRES_DB: raghub
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-litellm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raghub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports: ["127.0.0.1:56333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
    healthcheck:
      # qdrant image ships no curl/wget; bash /dev/tcp probes the HTTP port
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: raghub       # dev-only credentials — override in prod env
      MINIO_ROOT_PASSWORD: raghub123
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  tei:
    # First start downloads the BAAI/bge-m3 model (~2.3 GB) into the teidata volume;
    # start_period below allows for it. CPU image; GPU variants are a prod concern.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64  # no arm64 build published; runs under emulation on Apple Silicon
    profiles: ["ml"]  # not required for CI/dev without ML; tests use the hash backend
    command: --model-id BAAI/bge-m3
    ports: ["127.0.0.1:58080:80"]
    volumes: [teidata:/data]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable  # rolling stable; bump policy per PRD MODEL-13 (monthly, behind a probe run)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-raghub-dev-master}
      # encrypts provider keys at rest in litellm's DB — CHANGE IN PROD along with LITELLM_MASTER_KEY
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-raghub-dev-salt}
      DATABASE_URL: postgresql://raghub:raghub@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
    ports: ["127.0.0.1:54000:4000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  qdrantdata:
  miniodata:
  teidata:
