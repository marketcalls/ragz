# Not a multi-package workspace -- this file exists only to carry pnpm
# settings. `packages` is deliberately empty: pnpm <10 rejects the file
# without the key ("packages field missing or empty"), which is why an
# unpinned `pnpm install` failed here. The version is pinned by
# package.json#packageManager so CI and developers resolve the same pnpm.
packages: []

# Dependencies allowed to run install scripts; everything else is blocked.
# `onlyBuiltDependencies` is the ORIGINAL pnpm 10.0 key. `allowBuilds` (which
# this file used before) is the NEWER consolidated form added in pnpm 10.23+,
# supporting per-package allow/deny with reasons -- the reverse of what an
# earlier comment here claimed. Either works under the pinned pnpm 10.34.5;
# this one is used because it is also understood by every 10.x, so the file
# does not break if the pin moves down.
onlyBuiltDependencies:
  - esbuild

# Security floors for transitive dependencies (Jul-Sep 2026 advisories). Each
# is scoped to the major line its parent asks for, so no parent gets a major it
# was not written against. Drop an entry once every parent resolves past it.
overrides:
  brace-expansion@^1: ^1.1.21    # GHSA-mh99-v99m-4gvg, -rgw5-, -q2hr-, -qhr7-, -6j4f-
  brace-expansion@^2: ^2.1.7
  brace-expansion@^5: ^5.0.12
  js-yaml@^4: ^4.3.2             # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh
  nanoid@^3: ^3.3.18             # GHSA-2v37-7h3g-55p8
  browserslist: ^4.28.7          # GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g
  baseline-browser-mapping: ^2.11.0  # GHSA-w5vr-8v7q-w6rv
  source-map-js: ^1.2.2          # GHSA-68fv-2mgg-jv7q
