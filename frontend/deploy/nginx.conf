# SPA + API reverse proxy for the frontend image.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA owns its routes: /chat/<id>, /admin/models and friends have no
    # file on disk, so anything that is not a real asset must fall through to
    # index.html or a refresh on a deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable; index.html must never be cached or clients
    # keep loading the previous deploy's asset names after a release.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~ ^/api/v1/chats/[^/]+/attachments$ {
        # Bound the request before nginx or Starlette parses/spools multipart.
        # Includes 10 MiB for multipart framing above the 50 MiB file default.
        client_max_body_size 60m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        # Preserve the product's streamed 1 GiB document boundary plus
        # multipart framing. The application still enforces route-specific
        # limits (attachments remain 50 MiB by default) before storage.
        client_max_body_size 1025m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers stream as SSE: buffering would hold the whole response
        # and deliver it in one lump, so the user sees nothing until the end.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
